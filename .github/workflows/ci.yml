name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source imports
        run: |
          python -m compileall src

      - name: Smoke run training
        run: |
          python src/main.py --epochs 1 --n-samples 256 --batch-size 64 --scheduler none --no-amp --artifacts-dir artifacts/ci-smoke
